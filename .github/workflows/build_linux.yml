name: Build Linux with OpenCL

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Exact commit SHA or tag to preflight; empty uses the workflow ref"
        required: false
        default: ""
        type: string
  push:
    branches:
      - 'cherub-preflight/**'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Install OpenCL and libcurl dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ocl-icd-opencl-dev opencl-headers libcurl4-openssl-dev libgmp-dev

      - name: Build PrMers and Aevum engine
        run: |
          make clean-all || true
          make -j"$(nproc)" KERNEL_PATH=./kernels/

      - name: Run host and routing tests
        run: |
          make test-gm
          make test-aevum-host
          make test-aevum-auto
          make test-aevum-default
          make test-gui-state
          make test-proof-marin
          make test-aevum-source
          make test-backend-compat
          make -C third_party/aevum test-engine-api

      - name: Package for release
        run: |
          mkdir -p prmers_package/kernels
          mkdir -p prmers_package/third_party/aevum/build-engine
          cp prmers prmers_package/
          cp kernels/prmers.cl prmers_package/kernels/
          cp third_party/aevum/build-engine/libaevum_engine.so prmers_package/third_party/aevum/build-engine/
          cp third_party/aevum/tune.txt prmers_package/third_party/aevum/
          tar -czvf prmers-linux.tar.gz -C prmers_package .

      - name: Calculate SHA256 checksum
        run: sha256sum prmers-linux.tar.gz > prmers-linux.tar.gz.sha256

      - name: Upload Linux package artifact
        uses: actions/upload-artifact@v4
        with:
          name: prmers-linux
          path: |
            prmers-linux.tar.gz
            prmers-linux.tar.gz.sha256
          if-no-files-found: error

      - name: Upload release to GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ✅ This release was built automatically via GitHub Actions from the source code in this repository.
            🔒 Each binary is accompanied by a `.sha256` checksum file for verification.
            💡 Verify with:
                sha256sum -c <filename>.sha256
            PrMers production release built from immutable tag `${{ github.ref_name }}`.
            - PrMers source SHA: `${{ github.sha }}`
            - Workflow run: `${{ github.run_id }}`
            - Standalone Aevum tag: `v0.3.96-pass5-prp-max`
            - Standalone Aevum source SHA: `13c43629d37b32dad8378fad9b7dae0d6b88dcef`
            - PFA7 fftP gather KEEP: RTX 3080 fixed-plan median +0.631%; Radeon VII -0.121% within no-regression tolerance; PFA3/PFA9 exact and generated fftP unchanged.
            - NVIDIA PFA WIDTH512 kfftWGF61 chain-tabmul specialization: RTX 3080 fixed-plan median +0.544% PFA7 and +0.655% PFA9 full iteration; kfftWGF61 +3.78%; Radeon VII generated kernel content remains byte-identical to stock and exact.
            - NVIDIA PFA ZEROHACK_H=0 tail/height policy: RTX 3080 fixed-plan full iteration +0.131% PFA3, +0.079% PFA7, +0.151% PFA9 with 20/20 paired blocks winning; Radeon VII retains the existing ZEROHACK_H default and remains exact on PFA3/PFA7/PFA9.
            - CUDA ZEROHACK_W is selected empirically after plan selection using exact cached mini-benchmarking; RTX 3080 validated W0 while AMD/OpenCL behavior remains unchanged.
            - PrMers wide-digit Aevum adapter correctness validated on Radeon VII at p=19121591 with fixed plan 1:256:4:256:101.
            - Supported release architectures: Linux x86_64, Windows x86_64, macOS x86_64 and arm64.
            - Correctness and release preflight: PASS before tagging.
            Platform artifacts include SHA256 checksum files for verification.
          files: |
            prmers-linux.tar.gz
            prmers-linux.tar.gz.sha256
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
