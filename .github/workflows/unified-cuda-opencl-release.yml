name: Unified CUDA/OpenCL release
on:
  push:
    branches: [main]
    paths:
      - src/aevum/EngineAevum.cpp
      - Makefile
      - tests/dual_backend_source_test.py
      - scripts/build_aevum_cuda.sh
      - tests/test_aevum_cuda_auto_build.py
      - .github/workflows/build_mac_os.yml
      - .github/workflows/unified-cuda-opencl-release.yml
  pull_request:
    branches: [main]
    paths:
      - src/aevum/EngineAevum.cpp
      - Makefile
      - tests/dual_backend_source_test.py
      - scripts/build_aevum_cuda.sh
      - tests/test_aevum_cuda_auto_build.py
      - .github/workflows/build_mac_os.yml
      - .github/workflows/unified-cuda-opencl-release.yml
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a new immutable release only after real-GPU selector approval
        required: false
        type: boolean
        default: false
# Build and test jobs need only repository read access. The publish job below
# elevates contents permission only for an explicit approved workflow dispatch.
permissions:
  contents: read
env:
  TAG: v4.20.97-alpha-v100.48-correctness-hardening
jobs:
  linux:
    runs-on: ubuntu-24.04
    container: nvidia/cuda:13.0.2-devel-ubuntu24.04
    steps:
      - run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates g++ make python3 binutils libgmp-dev ocl-icd-opencl-dev
      - uses: actions/checkout@v4
      - name: Compile both backends from main
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/release_version_consistency_test.py --expected-tag "$TAG"
          python3 tests/dual_backend_source_test.py
          python3 tests/test_aevum_cuda_auto_build.py
          make test-aevum-device-map
          make test-aevum-auto
          # Validate a fresh serial build: users should be able to run plain
          # 'make' with no -j flag or special CUDA setup.
          make MARCH=x86-64 KERNEL_PATH=./kernels/
          # Also validate the incremental parallel code path.
          # Exercise the serial default before the incremental parallel build.
          make MARCH=x86-64
          make -j"$(nproc)" MARCH=x86-64 KERNEL_PATH=./kernels/
          test -s prmers
          python3 tests/release_version_consistency_test.py --binary ./prmers --expected-tag "$TAG"
          test -s third_party/aevum/build-engine/libaevum_engine.so
          # The *ordinary* make must now auto-build CUDA without manual steps.
          test -s third_party/aevum/build-engine/libaevum_engine_cuda.so
          mkdir -p stage/third_party/aevum/build-engine stage/kernels dist
          cp prmers stage/
          cp third_party/aevum/build-engine/libaevum_engine.so stage/third_party/aevum/build-engine/
          make aevum-dual
          test -s third_party/aevum/build-engine/libaevum_engine_cuda.so
          readelf -d third_party/aevum/build-engine/libaevum_engine_cuda.so | tee deps.txt
          grep -q libnvrtc deps.txt
          grep -q libcuda deps.txt
          cp third_party/aevum/build-engine/libaevum_engine_cuda.so stage/third_party/aevum/build-engine/
          cp -R kernels/. stage/kernels/
          cp third_party/aevum/tune.txt stage/third_party/aevum/tune.txt
          printf '%s\n' 'AUTO measures CUDA and OpenCL per supported workload with a matching-residue safety gate.' 'Missing driver, NVRTC, plugin or GPU mapping: OpenCL fallback.' 'Real-GPU runtime validation still required.' > stage/README_DUAL_BACKEND.txt
          tar -czf dist/prmers-linux-unified.tar.gz -C stage .
          tar -tzf dist/prmers-linux-unified.tar.gz > archive_list.txt
          grep -q libaevum_engine_cuda.so archive_list.txt
          grep -q libaevum_engine.so archive_list.txt
      - uses: actions/upload-artifact@v4
        with:
          name: unified-linux
          path: dist/*
          if-no-files-found: error
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make python curl unzip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gmp
            mingw-w64-ucrt-x86_64-opencl-headers
            mingw-w64-ucrt-x86_64-opencl-icd
      - uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.2.0'
          method: network
      - name: Build Windows host and OpenCL/CUDA engines from main
        shell: msys2 {0}
        run: |
          set -euo pipefail
          python tests/release_version_consistency_test.py --expected-tag "$TAG"
          python tests/dual_backend_source_test.py
          python tests/test_aevum_cuda_auto_build.py
          python tests/native_pfa_cli_source_test.py
          make -j"$(nproc)" MARCH=x86-64
          test -s prmers.exe
          python tests/release_version_consistency_test.py --binary ./prmers.exe --expected-tag "$TAG"
          # Standard make detects the installed Windows CUDA SDK.
          test -s third_party/aevum/build-engine/aevum_engine_cuda.dll
          : "$CUDA_PATH"
          CUDA_ROOT="$(cygpath -u "$CUDA_PATH")"
          make aevum-dual AEVUM_CUDA_ROOT="$CUDA_ROOT"
          test -s third_party/aevum/build-engine/libaevum_engine.so
          test -s third_party/aevum/build-engine/aevum_engine_cuda.dll
          objdump -p third_party/aevum/build-engine/aevum_engine_cuda.dll > deps.txt
          grep -Eiq 'DLL Name:.*nvrtc' deps.txt
          mkdir -p stage/third_party/aevum/build-engine stage/kernels
          cp prmers.exe stage/
          cp third_party/aevum/build-engine/libaevum_engine.so stage/third_party/aevum/build-engine/aevum_engine.dll
          cp third_party/aevum/build-engine/aevum_engine_cuda.dll stage/third_party/aevum/build-engine/
          cp -R kernels/. stage/kernels/
          cp third_party/aevum/tune.txt stage/third_party/aevum/tune.txt
          for lib in libgmp-10.dll libgmpxx-4.dll libstdc++-6.dll libgcc_s_seh-1.dll libwinpthread-1.dll; do
            if test -f "/ucrt64/bin/$lib"; then cp "/ucrt64/bin/$lib" stage/; fi
          done
          if test -f /ucrt64/bin/OpenCL.dll; then cp /ucrt64/bin/OpenCL.dll stage/; fi
          printf '%s\n' 'AUTO measures CUDA and OpenCL per workload with a matching-residue safety gate.' \
            'If CUDA is absent or unsafe, OpenCL is retained.' > stage/README_DUAL_BACKEND.txt
      - name: Package portable Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path 'stage/*' -DestinationPath 'dist/prmers-windows-unified.zip' -CompressionLevel Optimal
          [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path 'dist/prmers-windows-unified.zip')).Dispose()
      - uses: actions/upload-artifact@v4
        with:
          name: unified-windows
          path: dist/*
          if-no-files-found: error
  macos:
    uses: ./.github/workflows/build_mac_os.yml

  publish:
    # Do not publish on main pushes. An explicit, approved dispatch is required.
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: unified-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: prmers-macos-release-packages
          path: dist
          merge-multiple: true
      - name: Release checked main binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 5
          cat > NOTES.md <<'EOF'
          PrMers v100.48: correctness and reliability hardening across checkpoint/resume handling, P-1 and ECM failure paths, LL-safe plan capacity, worktodo/input validation, and release identity checks; retains the v100.47 unified CUDA/OpenCL auto-build and selector behavior.

          Aevum's existing per-workload FFT selector remains authoritative, including tune.txt and explicit FFT overrides. On NVIDIA, a bounded workload-aware probe verifies canonical residue agreement, selecting CUDA only if at least 3% faster. Missing CUDA/NVRTC, unsupported GPU mapping, errors and mismatches safely retain OpenCL.

          GPU mapping checks PCI identities where available, including multi-GPU systems. Ambiguous mapping fails closed to OpenCL. Windows and Linux ship both engines; macOS arm64, x86_64 and universal2 ship OpenCL without requiring CUDA.

          Source: plain make automatically builds OpenCL and, when a complete CUDA Toolkit SDK is detected, the optional CUDA plugin in an independent incremental build tree. On machines without CUDA, make succeeds with OpenCL only and prints how to install the optional CUDA Toolkit. make AEVUM_CUDA_MODE=off forces an OpenCL-only build; make aevum-dual or make AEVUM_CUDA_MODE=required requires an SDK. make install installs available plugins. AEVUM_BACKEND=opencl disables CUDA selection; AEVUM_BACKEND=cuda provides diagnostic opt-in subject to the residue safety gate. Explicit AEVUM_ENGINE_LIB retains priority.

          CI validates builds, packaging and GPU-less checks; cross-vendor hardware correctness and end-to-end performance still require real-GPU validation.
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite already-published release $TAG" >&2
            exit 1
          fi
          gh release create "$TAG" ./*.tar.gz ./*.zip ./SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "PrMers v100.48 correctness and reliability hardening" --notes-file NOTES.md
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,isPrerelease,assets
