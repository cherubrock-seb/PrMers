name: PrMers CUDA and OpenCL preview
on:
  push:
    branches: [exp/cuda-opencl-preview-v10044]
    paths: [.github/workflows/cuda-opencl-preview.yml]
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE_TAG: v4.20.97-alpha-v100.44-aevum-pass5-prp-max
  PREVIEW_TAG: v4.20.97-alpha-v100.44-cuda-opencl-preview1
  BASE_URL: https://github.com/cherubrock-seb/PrMers/releases/download/v4.20.97-alpha-v100.44-aevum-pass5-prp-max
jobs:
  linux:
    runs-on: ubuntu-24.04
    container: nvidia/cuda:13.0.2-devel-ubuntu24.04
    steps:
      - run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git curl ca-certificates g++ make binutils file libgmp-dev ocl-icd-opencl-dev
      - uses: actions/checkout@v4
        with:
          ref: v4.20.97-alpha-v100.44-aevum-pass5-prp-max
      - name: Native CUDA engine build
        shell: bash
        run: |
          set -euo pipefail
          test -f /usr/local/cuda/include/nvrtc.h
          test -f /usr/local/cuda/lib64/stubs/libcuda.so
          make -C third_party/aevum clean
          make -C third_party/aevum CUDA=1 engine-lib -j"$(nproc)" OPENCL_LIBS='-L/usr/local/cuda/lib64/stubs -L/usr/local/cuda/lib64 -lcuda -lnvrtc'
          test -s third_party/aevum/build-engine/libaevum_engine.so
          readelf -d third_party/aevum/build-engine/libaevum_engine.so | tee deps.txt
          grep -q libnvrtc deps.txt
          grep -q libcuda deps.txt
      - name: Assemble Linux OpenCL and CUDA packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p base dist unpack
          curl -fLsS --retry 3 "$BASE_URL/prmers-linux.tar.gz" -o base/prmers-linux.tar.gz
          curl -fLsS --retry 3 "$BASE_URL/prmers-linux.tar.gz.sha256" -o base/prmers-linux.tar.gz.sha256
          (cd base && sha256sum -c prmers-linux.tar.gz.sha256)
          cp base/prmers-linux.tar.gz dist/prmers-linux-opencl.tar.gz
          tar -xzf base/prmers-linux.tar.gz -C unpack
          count=0
          while IFS= read -r -d '' f; do
            cp third_party/aevum/build-engine/libaevum_engine.so "$f"
            count=$((count+1))
          done < <(find unpack -type f -name libaevum_engine.so -print0)
          test "$count" -gt 0
          printf '%s\n' 'EXPERIMENTAL CUDA native engine: requires NVIDIA driver and CUDA NVRTC 13.x runtime.' 'Built without a GPU: correctness and performance NOT hardware validated.' 'Use -aevum and your NVIDIA device index with -d.' > unpack/CUDA_EXPERIMENTAL.txt
          tar -czf dist/prmers-linux-cuda-experimental.tar.gz -C unpack .
      - uses: actions/upload-artifact@v4
        with:
          name: dual-linux
          path: dist/*
          if-no-files-found: error
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4.20.97-alpha-v100.44-aevum-pass5-prp-max
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-opencl-headers
            mingw-w64-ucrt-x86_64-opencl-icd
      - uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.2.0'
          method: network
      - name: Build Aevum CUDA DLL using MSYS2
        shell: msys2 {0}
        run: |
          set -euo pipefail
          : "${CUDA_PATH:?Missing CUDA_PATH}"
          P="$(cygpath -u "$CUDA_PATH")"
          test -f "$P/include/cuda.h"
          test -f "$P/include/nvrtc.h"
          test -f "$P/lib/x64/cuda.lib"
          test -f "$P/lib/x64/nvrtc.lib"
          make -C third_party/aevum clean
          make -C third_party/aevum CUDA=1 engine-lib -j"$(nproc)" CXX=g++ DL_LIBS= ENGINE_LINK_FLAGS='-shared -static-libstdc++ -static-libgcc' CUDAFLAGS="-DCUDA_BACKEND -Isrc/cuda -I\"$P/include\"" OPENCL_LIBS="-L\"$P/lib/x64\" -l:cuda.lib -l:nvrtc.lib"
          test -s third_party/aevum/build-engine/libaevum_engine.so
          objdump -p third_party/aevum/build-engine/libaevum_engine.so > deps.txt
          echo '=== PE DLL IMPORTS ==='
          grep -i 'DLL Name:' deps.txt || true
          echo '=== CUDA IMPORT SYMBOLS ==='
          nm third_party/aevum/build-engine/libaevum_engine.so | grep -Ei 'cuInit|nvrtcCompileProgram' | head -20 || true
          # CUDA 13.2's cuda.lib linked under MinGW provides a driver API thunk
          # (cuInit + pfn_cuInit) that loads nvcuda.dll dynamically at runtime.
          # Accordingly nvcuda.dll is NOT required in the PE import table.
          # Keep the NVRTC DLL and driver-entry checks instead.
          if ! grep -Eiq 'DLL Name:.*nvrtc' deps.txt; then
            echo 'ERROR: NVRTC DLL is not in PE import table'
            exit 1
          fi
          nm third_party/aevum/build-engine/libaevum_engine.so > symbols.txt
          if ! grep -Fq ' T cuInit' symbols.txt; then
            echo 'ERROR: CUDA driver API entrypoint cuInit missing'
            exit 1
          fi
          if ! grep -Fq ' B pfn_cuInit' symbols.txt; then
            echo 'ERROR: CUDA driver loader pfn_cuInit missing'
            exit 1
          fi
          if ! grep -Fq ' I __imp_nvrtcCompileProgram' symbols.txt; then
            echo 'ERROR: NVRTC compile function import missing'
            exit 1
          fi
          echo 'CUDA imports and dynamic driver loader validated.'
      - name: Repack original Windows executable with CUDA engine
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force base, opencl, cuda, dist | Out-Null
          gh release download $env:SOURCE_TAG --repo $env:GITHUB_REPOSITORY --pattern 'prmers-windows.zip*' --dir base
          $expected = (Get-Content 'base/prmers-windows.zip.sha256' -Raw).Trim().Split(' ')[0].ToLower()
          $actual = (Get-FileHash 'base/prmers-windows.zip' -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw 'OpenCL original SHA256 mismatch' }
          Copy-Item 'base/prmers-windows.zip' 'dist/prmers-windows-opencl.zip'
          Expand-Archive 'base/prmers-windows.zip' -DestinationPath opencl
          Copy-Item 'opencl/*' cuda -Recurse -Force
          $dlls = @(Get-ChildItem cuda -Recurse -File -Filter 'aevum_engine.dll')
          if ($dlls.Count -eq 0) { throw 'Aevum DLL missing in original archive' }
          foreach ($dll in $dlls) { Copy-Item 'third_party/aevum/build-engine/libaevum_engine.so' $dll.FullName -Force }
          @'
          EXPERIMENTAL CUDA native engine: requires NVIDIA driver and compatible CUDA NVRTC 13.x runtime.
          Built without a GPU: correctness and performance NOT hardware validated.
          Use -aevum and your NVIDIA device index with -d.
          '@ | Set-Content -Encoding utf8 'cuda/CUDA_EXPERIMENTAL.txt'
          Compress-Archive -Path 'cuda/*' -DestinationPath 'dist/prmers-windows-cuda-experimental.zip'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path 'dist/prmers-windows-cuda-experimental.zip')).Dispose()
      - uses: actions/upload-artifact@v4
        with:
          name: dual-windows
          path: dist/*
          if-no-files-found: error
  macos:
    runs-on: ubuntu-24.04
    steps:
      - name: Preserve verified OpenCL macOS builds from the stable tag
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p base dist
          for arch in arm64 x86_64 universal2; do
            curl -fLsS --retry 3 "$BASE_URL/prmers-macos-$arch.tar.gz" -o "base/prmers-macos-$arch.tar.gz"
            tar -tzf "base/prmers-macos-$arch.tar.gz" >/dev/null
            cp "base/prmers-macos-$arch.tar.gz" "dist/prmers-macos-$arch-opencl.tar.gz"
          done
          curl -fLsS --retry 3 "$BASE_URL/SHA256SUMS.txt" -o base/SHA256SUMS.txt
          (cd base && grep prmers-macos- SHA256SUMS.txt | sha256sum -c -)
      - uses: actions/upload-artifact@v4
        with:
          name: dual-macos
          path: dist/*
          if-no-files-found: error
  publish-preview:
    runs-on: ubuntu-24.04
    needs: [linux, windows, macos]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4.20.97-alpha-v100.44-aevum-pass5-prp-max
      - uses: actions/download-artifact@v4
        with:
          pattern: dual-*
          path: dist
          merge-multiple: true
      - name: Verify all packages and create manifest
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 2
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 5
          for f in *.tar.gz; do tar -tzf "$f" >/dev/null; done
          for f in *.zip; do unzip -tq "$f" >/dev/null; done
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish experimental prerelease (never replace stable)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$PREVIEW_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Existing preview cannot be overwritten'
            exit 1
          fi
          SHA="$(git rev-parse HEAD)"
          cat > NOTES.md <<EOF
          CUDA/OpenCL experimental preview, using the exact PrMers $SOURCE_TAG source ($SHA).

          Windows and Linux x86_64: original OpenCL and newly compiled native CUDA engines.
          macOS arm64, x86_64, universal2: original checksum-verified OpenCL archives. macOS CUDA is unsupported.

          **WARNING: CUDA packages passed compile/link/package checks only. GPU runtime, exactness and performance were not validated on NVIDIA hardware.**
          Requires a suitable NVIDIA driver and CUDA 13.x NVRTC runtime. Existing stable releases remain unchanged.
          EOF
          gh release create "$PREVIEW_TAG" ./dist/*.tar.gz ./dist/*.zip ./dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$SHA" --draft --prerelease --title 'PrMers v100.44 OpenCL + CUDA experimental preview' --notes-file NOTES.md
          gh release edit "$PREVIEW_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          gh release view "$PREVIEW_TAG" --repo "$GITHUB_REPOSITORY" --json url,isPrerelease,assets
 symbols.txt; then
