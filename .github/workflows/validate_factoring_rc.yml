name: Validate factoring RC

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v100.13-gm-vtrace-aevum-rc2
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'scripts/**'
      - 'Makefile'
      - '.github/workflows/validate_factoring_rc.yml'

permissions:
  contents: read

jobs:
  linux-host:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ocl-icd-opencl-dev opencl-headers libgmp-dev
      - name: Build
        run: |
          make clean-all || true
          make -j"$(nproc)" KERNEL_PATH=./kernels/
      - name: New host algebra/source gates
        run: |
          python3 tests/gaussian_pm1_vtrace_math_test.py
          python3 tests/gaussian_pm1_vtrace_source_test.py
      - name: Existing no-regression gates
        run: |
          make test-gm
          make test-aevum-host
          make test-aevum-auto
          make test-aevum-source
          make test-backend-compat
          make -C third_party/aevum test-engine-api

  macos-build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - name: Install GMP
        run: brew install gmp || brew upgrade gmp || true
      - name: Build portable source on macOS
        shell: bash
        run: |
          set -euo pipefail
          GMP_PREFIX="$(brew --prefix gmp)"
          make clean-all || true
          make -j"$(sysctl -n hw.logicalcpu)" \
            CXX=c++ \
            CXXFLAGS="-I${GMP_PREFIX}/include -std=c++20 -O3 -Wall" \
            LDFLAGS="-L${GMP_PREFIX}/lib -lgmpxx -lgmp" \
            KERNEL_PATH=./kernels/ \
            MACOSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET"
      - name: macOS host/source gates
        run: |
          python3 tests/gaussian_pm1_vtrace_math_test.py
          python3 tests/gaussian_pm1_vtrace_source_test.py
          make test-gm
          make test-aevum-source
          make test-backend-compat

  promotion-gate:
    runs-on: ubuntu-latest
    needs: [linux-host, macos-build]
    steps:
      - run: |
          echo "Host/CI gate passed."
          echo "Do NOT tag v100.13 until the remaining Radeon VII real-GPU gate passes."
